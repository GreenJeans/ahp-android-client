# Builds the `github` flavor release APK and publishes it to GitHub Releases.
#
# Trigger: push a tag `v<versionName>` (e.g. `v0.2.0`). The tag must match the
# versionName in `app/build.gradle.kts`; the job fails otherwise so a mistyped
# tag can never ship a build labelled with the wrong version.
#
# Releases are NOT marked prerelease: Obtainium's default config ignores
# prereleases, so marking them would hide the build from the users this
# channel exists for.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions),
# all the same values already used for local Play builds:
#   AHP_KEYSTORE_BASE64    base64 of the upload keystore file
#   AHP_KEYSTORE_PASSWORD  keystore password
#   AHP_KEY_ALIAS          key alias
#   AHP_KEY_PASSWORD       key password
#
# The APK is signed with the upload keystore, NOT Google Play's app-signing
# key, so it cannot update over a Play Store install (and vice versa):
# switching channels means uninstalling first. The release notes say so.

name: Release APK (GitHub flavor)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${VERSION} in app/build.gradle.kts"
            exit 1
          fi
          echo "Building ${GITHUB_REF_NAME}"

      - name: Decode keystore
        env:
          AHP_KEYSTORE_BASE64: ${{ secrets.AHP_KEYSTORE_BASE64 }}
        run: |
          echo "$AHP_KEYSTORE_BASE64" | base64 -d > /tmp/hostline-release.keystore
          echo "AHP_KEYSTORE_FILE=/tmp/hostline-release.keystore" >> "$GITHUB_ENV"

      - name: Build GitHub release APK
        env:
          AHP_KEYSTORE_PASSWORD: ${{ secrets.AHP_KEYSTORE_PASSWORD }}
          AHP_KEY_ALIAS: ${{ secrets.AHP_KEY_ALIAS }}
          AHP_KEY_PASSWORD: ${{ secrets.AHP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Name the APK and checksum it
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/github/release/app-github-release.apk "hostline-${VERSION}-github.apk"
          sha256sum "hostline-${VERSION}-github.apk" > "hostline-${VERSION}-github.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hostline-*-github.apk
            hostline-*-github.apk.sha256
          generate_release_notes: true
          body: |
            GitHub build of Hostline ${{ github.ref_name }}. Pro is included free in this build during the beta (the Play Store version sells it as a one-time unlock).

            Install with [Obtainium](https://github.com/ImranR98/Obtainium): Add App, paste `https://github.com/GreenJeans/ahp-android-client` — or download the APK below.

            This APK is signed with our own release key, not Google Play's: it cannot update over a Play Store install. Switching between the GitHub build and the Play Store version means uninstalling first.
